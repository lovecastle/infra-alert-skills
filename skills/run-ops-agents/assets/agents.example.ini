# opsagent: the agents in the alert chat. Copy to /etc/opsagent/agents.ini.
# No secret belongs in this file. Bot tokens and the incidents token go in agents.env beside it (mode 600):
#   LEAD_BOT_TOKEN=123456:AA...        one line per [agent:<name>] below: <NAME>_BOT_TOKEN
#   WEB_BOT_TOKEN=234567:BB...
#   AGENT_TOKEN=...                    the same value as the Worker's AGENT_TOKEN secret
#   CLAUDE_CODE_OAUTH_TOKEN=...        from `claude setup-token` (or ANTHROPIC_API_KEY=...)

[chat]
# The group the alerts arrive in, and the Telegram user ids of the people who may give orders and approve.
# Being in the group gives no say: only these ids do. Find yours by writing to @userinfobot, or with
# `infrawatch.py chats`.
chat_id = -1001234567890
admins = 111111111, 222222222
# A topic of a forum group for the agents' messages (empty: the main chat).
thread_id =
# The language agents write in.
language = English
# Only when api.telegram.org is not reachable from this machine: your own reverse proxy.
api_host =

[incidents]
# The Cloudflare Worker's list of what is open right now (monitor-cloudflare). Empty: agents only answer mentions.
url = https://infra-alerts.ACCOUNT.workers.dev/incidents
# Which incidents agents pick up by themselves: crit, or crit, warn.
levels = crit
# How long an admin has to take a new incident before an agent starts on it. 0 = at once.
grace_minutes = 5
poll_seconds = 30
# An incident still open this long after an agent reported it done is handed back to the admins, loudly.
recheck_minutes = 15
# A proposal nobody answers in this time is not carried out.
approval_minutes = 30
# At most this many incidents are started on within an hour; the rest are left to the admins.
max_per_hour = 6

[claude]
command = claude
# Empty: Claude Code's default model.
model =
# What Claude Code may run on this machine without being asked. Everything else is refused. `ssh` is how agents
# reach the servers; what they can do there is decided on each server (see references/access.md).
allowed_tools = Bash(ssh *), Bash(curl *), Read, Grep, Glob
max_turns = 40
timeout_minutes = 15
# Where Claude Code runs: the directory that holds the skills (.claude/skills/triage-alerts) and nothing private.
workdir = /var/lib/opsagent/work

[policy]
# In the agents' own words. What they may do without asking, and what needs an admin's yes in the chat first.
auto = restart a service or a container that the alert says is not running; delete caches and temporary files that are rebuilt by themselves; rotate or vacuum logs
ask = delete or move any other data; reboot; change firewall rules, users, keys, packages or configuration files; anything on a database; anything you are not sure can be undone

# One section per agent. Each is a bot of its own (BotFather), with privacy mode disabled so it sees the chat.
# Exactly one is the lead: it watches the incidents and announces them. An incident goes to the agent whose hosts
# name its host, else to the lead, who can hand it on.
[agent:lead]
lead = true
about = Watches every alert, takes what belongs to nobody else, hands work to the agent that knows the system.

[agent:web]
about = Web servers, reverse proxies, containers and certificates.
hosts = vps-01, vps-02

[agent:gpu]
about = The GPU machine: NVIDIA drivers, inference jobs, containers that use the card.
hosts = gpu-01
