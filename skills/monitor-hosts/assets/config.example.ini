# infrawatch config. Install as /etc/infrawatch/config.ini.
# Everything is optional except one channel. Lines starting with # are comments; no inline comments.
# After editing:  python3 /opt/infrawatch/infrawatch.py check
#
# Tokens are best kept out of this file, in /etc/infrawatch/notify.env (owner root, mode 600), one KEY=VALUE a line
# with the [notify] key in capitals: TG_BOT_TOKEN=..., TG_CHAT_ID=..., QYWX_KEY=..., and HEARTBEAT_URL / HEARTBEAT_TOKEN.
# Then this file holds no secret and can be read, shown and versioned freely. Put a token here and it must be mode 600.

[host]
# Shown in every message. Empty = the machine's hostname.
name =
# Daily "everything I watch" message, in the machine's own time zone. It arriving says the monitor is alive. Empty = none.
daily_report = 08:00

[notify]
# At least one channel must be set, here or in notify.env; every channel set gets every message.
# The environment (TG_BOT_TOKEN=...) wins over notify.env, which wins over this file.
prefix = [infrawatch]

# Telegram (see the setup-alert-channel skill): token from @BotFather, chat id from `infrawatch.py chats`.
tg_bot_token =
tg_chat_id =
# A topic of a forum group (optional).
tg_thread_id =
# A reverse proxy of api.telegram.org, where Telegram is not reachable (optional).
tg_api_host =

# WeCom / 企业微信 group bot: the key= part of its webhook URL.
qywx_key =
# Feishu / Lark custom bot: the last part of its webhook URL; fssecret if "signature verification" is on.
fskey =
fssecret =
# Lark (international): https://open.larksuite.com
fs_host =
# DingTalk / 钉钉 group bot: access_token; dd_bot_secret if "sign" security is on.
# With "keyword" security instead, use the keyword: infra
dd_bot_token =
dd_bot_secret =
# Bark (iOS): https://api.day.app/<key>, or your own server's URL with the key.
bark_push =
# ntfy: topic (and your own server / access token if you have them).
ntfy_topic =
ntfy_url =
ntfy_token =
# Server酱 SendKey (Turbo or Server酱3).
push_key =
# PushPlus token.
push_plus_token =
# Anything else: receives POST {"title", "body", "level": "alert"|"info", "source": "infrawatch"}.
webhook_url =

[heartbeat]
# After every run, POST here so something outside this machine notices when it goes silent:
# the monitor-cloudflare Worker (https://<worker>/hb/<name> + its HEARTBEAT_TOKEN), or a healthchecks.io ping URL.
url =
token =

[alerting]
# Bad readings in a row (= minutes) before a problem is told, good ones before it is called resolved.
fail_threshold = 3
ok_threshold = 2
# A critical problem still open is told again this often. 0 = never. Warnings are never repeated.
remind_hours = 4

[thresholds]
# Percent used.
disk_warn = 85
disk_crit = 95
inode_warn = 90
inode_crit = 98
mem_warn = 90
mem_crit = 97
swap_warn = 80
# 5-minute load average divided by the number of cores.
load_warn = 1.5
load_crit = 3
# NVIDIA GPU: temperature in °C, memory in percent. Tune to the card.
gpu_temp_warn = 85
gpu_temp_crit = 92
gpu_mem_warn = 90
gpu_mem_crit = 98
# Days left on a certificate.
cert_days_warn = 14
cert_days_crit = 3

[disks]
# Mount points not to watch (shell patterns).
ignore = /boot/efi, /snap/*, /run/*, /var/lib/docker/*

[services]
# systemd units that must be active, e.g.  units = nginx, postgresql, my-app
units =
# Docker containers that must be running, e.g.  containers = imgproxy, redis
containers =
# Also warn when any systemd unit is in the failed state.
failed_units = true

[http]
# name = URL            any 2xx/3xx answer is fine
# name = URL | text     ...and the body must contain the text
# Add the Worker's /health here and the hosts watch the watcher back.
# site = https://example.com/
# api = https://api.example.com/health | ok
# watcher = https://infra-alerts.<you>.workers.dev/health

[tcp]
# name = host:port
# postgres = 127.0.0.1:5432

[certs]
# TLS certificates to watch for expiry, e.g.  hosts = example.com, api.example.com:8443
hosts =

[gpu]
# auto = watch NVIDIA GPUs when nvidia-smi exists; true = its absence is an alert; false = never.
enabled = auto
# Warn when every GPU has been under idle_util percent for this many minutes: a job that died leaves the card idle.
# 0 = off. Leave it off on machines that are idle by design.
idle_minutes = 0
idle_util = 5
# Process names that must be on a GPU, e.g.  processes = python3, ffmpeg
processes =

[security]
# Learns what is normal on its first run, then tells once: auth/persistence files new, changed or removed (passwd,
# sudoers, authorized_keys, cron, sshd, systemd units), a new public listening port, a new container, an SSH login by
# a user+address or key never seen (a password login always), a burst of failed logins. It only tells.
enabled = false
# More files to watch (shell patterns), e.g.  extra_files = /etc/wireguard/*.conf, /usr/local/sbin/*
extra_files =
ssh_fails_per_min = 20
